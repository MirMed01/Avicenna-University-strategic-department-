{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
{% if hint %}<p class="muted">{{ hint }}</p>{% endif %}
<form method="post" enctype="multipart/form-data" class="f card">{% csrf_token %}
  {% include "_fields.html" %}
  <div class="row"><button class="btn">Сохранить</button>
    <a class="btn ghost" href="{{ back|default:'javascript:history.back()' }}">Отмена</a></div>
</form>
{% endblock %}
