# nginx: /etc/nginx/sites-available/kanon  (заменить qanun.tajmedun.tj на настоящий адрес)
server {
    listen 80;
    server_name qanun.tajmedun.tj;
    location /.well-known/acme-challenge/ { root /var/www/html; }   # для получения сертификата (certbot)
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;   # работает в nginx 1.24 (Ubuntu 24.04) и новее
    server_name qanun.tajmedun.tj;

    # Сертификат выдаёт certbot (Let's Encrypt): certbot --nginx -d qanun.tajmedun.tj
    ssl_certificate     /etc/letsencrypt/live/qanun.tajmedun.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qanun.tajmedun.tj/privkey.pem;

    client_max_body_size 12m;   # файлы портфолио и доказательств — до 10 МБ

    location /static/ {
        alias /srv/kanon/app/staticfiles/;
        expires 7d;
    }
    # ВАЖНО: /media/ наружу НЕ отдаётся. Файлы портфолио и аккредитации выдаёт сама программа,
    # проверяя права. Не добавлять location /media/.

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;   # затираем заголовок, присланный клиентом
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
    # Анкеты студентов: код в адресе и IP НЕ записываются в журнал — иначе по журналу можно связать ответ с человеком.
    location /s/ {
        access_log off;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
